name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder settings for type-checking, tests and the build. No real secrets.
  APP_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
  DATABASE_URL: pglite://memory
  EMAIL_PROVIDER: console
  SCHEDULER_MODE: 'off'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Type-check, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  postgres:
    name: Migrations on PostgreSQL 17 with Supabase roles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gentouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gentouch
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gentouch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Recreate Supabase's Data API roles and their default grants
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated;
          SQL
      - name: Apply migrations twice (the second run must change nothing)
        run: npm run db:migrate && npm run db:migrate
      - name: Check row-level security and privileges
        run: |
          check() {
            actual="$(psql -tAc "$2")"
            if [ "$actual" != "$3" ]; then echo "✗ $1: expected $3, got $actual"; exit 1; fi
            echo "✓ $1"
          }
          check "every table has row-level security" "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity" "0"
          check "anon cannot read people" "SELECT has_table_privilege('anon', 'public.people', 'SELECT')" "f"
          check "authenticated cannot read journal answers" "SELECT has_table_privilege('authenticated', 'public.form_answer_sets', 'SELECT')" "f"
          check "the app role can read people" "SELECT has_table_privilege('gentouch_app', 'public.people', 'SELECT')" "t"
          check "audit entries are insert-only for the app role" "SELECT has_table_privilege('gentouch_app', 'public.audit_logs', 'UPDATE') OR has_table_privilege('gentouch_app', 'public.audit_logs', 'DELETE')" "f"
      - name: Seed reference data
        run: npm run db:seed
        env:
          SEED_ADMIN_EMAIL: admin@example.org

  restore:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gentouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gentouch
      RESTORED_URL: postgres://postgres:postgres@localhost:5432/gentouch_restored
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gentouch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # A database worth losing: the real schema, reference data and a ministry of ~1,900 people.
      - name: Build a database to back up
        run: npm run db:migrate && npm run db:seed && npm run db:seed:demo -- --allow-postgres
        env:
          SEED_ADMIN_EMAIL: admin@example.org

      - name: Record what is in it
        run: |
          # A drill that restores an empty database proves nothing, so insist on a real ministry.
          people="$(psql -tAc "SELECT count(*) FROM people")"
          if [ "$people" -lt 1000 ]; then echo "✗ only $people people: the demo seed did not run"; exit 1; fi
          echo "✓ $people people to back up"
          psql -tAc "SELECT 'people=' || count(*) FROM people" | tee before.txt
          psql -tAc "SELECT 'nodes=' || count(*) FROM hierarchy_nodes" | tee -a before.txt
          psql -tAc "SELECT 'closure=' || count(*) FROM hierarchy_closure" | tee -a before.txt
          psql -tAc "SELECT 'days=' || count(*) FROM journal_days" | tee -a before.txt
          psql -tAc "SELECT 'answers=' || count(*) FROM form_answer_sets" | tee -a before.txt
          cat before.txt

      # pg_dump and pg_restore run from the same image as the server, so the versions always match
      # (a Supabase restore is the same pair of commands against a downloaded backup).
      - name: Back it up
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work" -w /work postgres:17 \
            pg_dump --format=custom --no-owner --no-privileges -h localhost -U postgres -d gentouch -f backup.dump
          ls -lh backup.dump

      - name: Restore it into an empty database
        run: |
          psql -c "CREATE DATABASE gentouch_restored"
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work" -w /work postgres:17 \
            pg_restore --no-owner --no-privileges --exit-on-error -h localhost -U postgres -d gentouch_restored backup.dump

      - name: Check the restored copy is whole
        run: npm run db:check -- "$RESTORED_URL"

      - name: Compare it with the original
        run: |
          psql -d gentouch_restored -tAc "SELECT 'people=' || count(*) FROM people" > after.txt
          psql -d gentouch_restored -tAc "SELECT 'nodes=' || count(*) FROM hierarchy_nodes" >> after.txt
          psql -d gentouch_restored -tAc "SELECT 'closure=' || count(*) FROM hierarchy_closure" >> after.txt
          psql -d gentouch_restored -tAc "SELECT 'days=' || count(*) FROM journal_days" >> after.txt
          psql -d gentouch_restored -tAc "SELECT 'answers=' || count(*) FROM form_answer_sets" >> after.txt
          if ! diff -u before.txt after.txt; then echo "✗ the restored copy does not match the original"; exit 1; fi
          echo "✓ every counted table matches"

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Kept, so the step below can say where the run had got to. Job logs need authentication to
      # read; annotations don't.
      - name: Run the end-to-end tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log

      # This job has been killed mid-run three times with every test passing locally, and each time
      # the log said only "The operation was canceled". A runner holds Chromium, `next dev` and an
      # embedded PostgreSQL at once, so running out of memory is the first suspect — but the point
      # of this step is to stop guessing.
      #
      # `if: failure()` is not enough: a killed step is *cancelled*, which is neither failure() nor
      # cancelled() (that one means the whole run was cancelled). `!success()` covers both.
      - name: Why did it stop?
        if: ${{ !success() }}
        run: |
          echo "::notice title=E2E memory::$(free -m | sed -n 2p)"
          echo "::notice title=E2E disk::$(df -h / | sed -n 2p)"
          if [ -f e2e.log ]; then
            echo "::error title=E2E stopped here::$(tail -40 e2e.log | tr '\n' ' ' | cut -c1-3000)"
          else
            echo "::error title=E2E stopped here::the run produced no output at all"
          fi
          killed="$(sudo dmesg 2>/dev/null | grep -i 'killed process' | tail -3)"
          if [ -n "$killed" ]; then echo "::error title=E2E killed by the kernel::$killed"; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !success() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
