name: Security

# docs/07 §7 "Security": dependency audit, secret scanning, and an OWASP ZAP baseline scan of a
# production build. Also weekly, so new advisories show up without a code change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 20 * * 0' # Mondays, 04:00 in Manila
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # High and critical advisories fail the build. Moderate ones are listed in the log.
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A repository on a personal account needs no gitleaks licence.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zap:
    name: Security headers and OWASP ZAP baseline (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gentouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # tests/e2e/server.ts: seed PostgreSQL, then `next start` on port 3100.
      E2E_SERVER_MODE: production
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gentouch
      E2E_REUSE_SERVER: '1'
      NEXT_DIST_DIR: .next-e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Placeholders for the build only. No real secrets.
          APP_URL: http://localhost:3100
          BETTER_AUTH_URL: http://localhost:3100
          BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gentouch
          EMAIL_PROVIDER: resend
          EMAIL_API_KEY: re_ci_not_a_real_key
          SCHEDULER_MODE: 'off'
      - name: Start the production build
        run: nohup node --import tsx tests/e2e/server.ts > server.log 2>&1 &
      - name: Wait until it answers
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3100/sign-in > /dev/null; then exit 0; fi
            sleep 2
          done
          cat server.log
          exit 1
      - name: Security checks (headers, script nonces, personal links, CSRF)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/portal.security.spec.ts
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3100
          rules_file_name: .zap/rules.tsv
          # -I: warnings are reported; only the rules marked FAIL in .zap/rules.tsv fail the job.
          cmd_options: -I
          allow_issue_writing: false
          fail_action: true
      - name: Server log
        if: failure()
        run: cat server.log
